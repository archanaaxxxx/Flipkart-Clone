<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipkart Login</title>

<link rel="stylesheet" href="../CSS/login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>

<!-- Navbar -->

<div class="navbar">

<div class="logo">
Flipkart
<p>Explore <span>Plus ✨</span></p>
</div>

<div class="search">

<input type="text" placeholder="Search for products, brands and more">

<i class="fa-solid fa-magnifying-glass"></i>

</div>

<button class="login-btn">Login</button>

<div class="nav-item">Become a Seller</div>

<div class="nav-item">
More
<i class="fa-solid fa-angle-down"></i>
</div>

<div class="nav-item">
 <div class="cart" onclick="goCart()">
    <i class="fa-solid fa-cart-shopping"></i>
    <span>Cart</span>

    <div class="cart-count">2</div>
</div>
</div>

</div>


<!-- Login Box -->

<div class="container">

<div class="left">

<h1>Login</h1>

<p>
Get access to your Orders,<br>
Wishlist and Recommendations
</p>


</div>


<div class="right">

<input type="text" placeholder="Enter Email/Mobile number">

<p class="terms">
By continuing, you agree to Flipkart's
<a href="#">Terms of Use</a> and
<a href="#">Privacy Policy</a>.
</p>

<button onclick="otp()">Request OTP</button>



<br>
<br>
<br>
<br>
<br>
<br>
<br>
<br>
<br>
<br>
<br>
<br>

 <a href ="#">New to Flipkart? Create an account</a>

</div>

</div>



<script src="../JS/login.js"></script>

</body>
</html>
